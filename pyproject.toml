[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dobot_api_v3"
version = "3.0.0"
description = "Dobot Robot API with V3-style modular architecture and V3 protocol semantics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dobot", email = "support@dobot.cc"},
]
keywords = ["dobot", "robot", "tcp-ip", "api", "automation", "robotics", "i18n"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
    "loguru>=0.7.0",
    "python-i18n>=0.3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/TechShare-inc/TCP-IP-Python-V3"
Repository = "https://github.com/TechShare-inc/TCP-IP-Python-V3"
Documentation = "https://github.com/TechShare-inc/TCP-IP-Python-V3#readme"
"Bug Tracker" = "https://github.com/TechShare-inc/TCP-IP-Python-V3/issues"

[tool.setuptools.packages.find]
include = ["dobot_api_v3*"]

[tool.setuptools.package-data]
dobot_api_v3 = ["py.typed", "locales/*.yml"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
