[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dobot_api_v3"
[project]
name = "dobot_api_v3"
version = "3.0.0a3"
description = "Dobot Robot API with V3-style modular architecture and V3 protocol semantics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dobot", email = "support@dobot.cc"},
]
keywords = ["dobot", "robot", "tcp-ip", "api", "automation", "robotics", "i18n"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
    "loguru>=0.7.0",
    "python-i18n>=0.3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
]
docs = [
    "sphinx>=7.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-markdown-builder>=0.6.6",
]

[project.urls]
Homepage = "https://github.com/TechShare-inc/TCP-IP-Python-V3"
Repository = "https://github.com/TechShare-inc/TCP-IP-Python-V3"
Documentation = "https://github.com/TechShare-inc/TCP-IP-Python-V3#readme"
"Bug Tracker" = "https://github.com/TechShare-inc/TCP-IP-Python-V3/issues"

[tool.ruff.lint]
ignore = [
    "F541",  # f-string with backslash is not a syntax error but Ruff doesn't know that yet
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast unit tests (no network, no hardware)",
    "integration: loopback integration tests using a local TCP stub server",
    "hil: hardware-in-the-loop tests (requires a real Dobot robot; set DOBOT_TEST_IP)",
]

[tool.coverage.run]
source = ["dobot_api_v3"]
omit = ["dobot_api_v3/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
